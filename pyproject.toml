[project]
name = "agent-plugins-dev"
version = "0.0.0"
description = "Dev tooling for the agent-plugins marketplace: tests, lint, and repo checks."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.16"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/obsidian-vault/skills/vault-conventions/scripts", "scripts"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["scripts", "plugins/obsidian-vault/skills/vault-conventions/scripts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable
